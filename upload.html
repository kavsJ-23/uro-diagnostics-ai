<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Upload Strip - Uro Diagnostics AI</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app-container">
    <aside class="sidebar">
      <div class="brand"><div class="brand-icon">🔬</div><span>Uro AI</span></div>
      <ul class="nav-menu">
        <li><a href="dashboard.html" class="nav-link">📊 <span>Dashboard</span></a></li>
        <li><a href="patient.html" class="nav-link">👤 <span>New Patient</span></a></li>
        <li><a href="upload.html" class="nav-link active">📷 <span>Scan Strip</span></a></li>
        <li><a href="history.html" class="nav-link">📁 <span>Records</span></a></li>
      </ul>
      <div class="sidebar-footer">
        <button id="theme-toggle" class="btn btn-secondary" style="width: 100%;">🌙</button>
        <button id="logout-btn" class="btn btn-secondary" style="width: 100%;">🚪 Logout</button>
      </div>
    </aside>

    <main class="main-content">
      <header class="top-header">
        <div class="header-title">
          <h1>Upload Urine Strip</h1>
          <p>Provide a high-resolution image of the diagnostic strip</p>
        </div>
      </header>

      <div class="glass-card" style="max-width: 700px; margin: 0 auto; text-align: center;">
        <div id="drop-zone" style="border: 2px dashed var(--border-color); padding: 3rem; border-radius: var(--radius-md); cursor: pointer; transition: var(--transition);">
          <div style="font-size: 3rem; margin-bottom: 1rem;">📤</div>
          <h3>Click or Drag & Drop Urine Strip Image</h3>
          <p style="color: var(--text-muted); font-size: 0.875rem; margin-top: 0.5rem;">Supports PNG, JPG, JPEG formats</p>
          <input type="file" id="file-input" accept="image/*" style="display: none;">
        </div>

        <div id="upload-success" style="display: none; align-items: center; justify-content: center; gap: 0.5rem; color: var(--success); margin-top: 1rem; font-weight: 600;">
          <span>✓ Image Uploaded Successfully</span>
        </div>

        <p id="file-name" style="margin-top: 0.5rem; font-size: 0.875rem; color: var(--text-muted);"></p>

        <img id="preview-img" src="" alt="Strip Preview" style="display: none; max-width: 100%; max-height: 250px; margin: 1.5rem auto 0; border-radius: var(--radius-md); border: 1px solid var(--border-color);">

        <button id="analyze-btn" class="btn btn-primary" style="margin-top: 1.5rem; width: 100%;" disabled>Run Computer Vision AI Prediction</button>
      </div>
    </main>
  </div>

  <script src="js/auth.js"></script>
  <script src="js/prediction.js"></script>
  <script src="js/upload.js"></script>
</body>
</html>
