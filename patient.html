<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Patient Registration - Uro Diagnostics AI</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app-container">
    <aside class="sidebar">
      <div class="brand"><div class="brand-icon">🔬</div><span>Uro AI</span></div>
      <ul class="nav-menu">
        <li><a href="dashboard.html" class="nav-link">📊 <span>Dashboard</span></a></li>
        <li><a href="patient.html" class="nav-link active">👤 <span>New Patient</span></a></li>
        <li><a href="upload.html" class="nav-link">📷 <span>Scan Strip</span></a></li>
        <li><a href="history.html" class="nav-link">📁 <span>Records</span></a></li>
      </ul>
      <div class="sidebar-footer">
        <button id="theme-toggle" class="btn btn-secondary" style="width: 100%;">🌙</button>
        <button id="logout-btn" class="btn btn-secondary" style="width: 100%;">🚪 Logout</button>
      </div>
    </aside>

    <main class="main-content">
      <header class="top-header">
        <div class="header-title">
          <h1>Patient Registration</h1>
          <p>Create a clinical intake file before reading strip sample</p>
        </div>
      </header>

      <div class="glass-card" style="max-width: 800px; margin: 0 auto;">
        <form id="patient-form">
          <div class="grid-2">
            <div class="form-group">
              <label for="patient-id">Patient ID</label>
              <input type="text" id="patient-id" class="form-control" value="PAT-8921" required>
            </div>
            <div class="form-group">
              <label for="patient-name">Full Name</label>
              <input type="text" id="patient-name" class="form-control" placeholder="e.g. Jane Doe" required>
            </div>
            <div class="form-group">
              <label for="patient-age">Age</label>
              <input type="number" id="patient-age" class="form-control" value="34" required>
            </div>
            <div class="form-group">
              <label for="patient-gender">Gender</label>
              <select id="patient-gender" class="form-control">
                <option value="Female">Female</option>
                <option value="Male">Male</option>
                <option value="Other">Other</option>
              </select>
            </div>
            <div class="form-group">
              <label for="patient-doctor">Attending Physician</label>
              <input type="text" id="patient-doctor" class="form-control" value="Dr. Alex Mercer" required>
            </div>
            <div class="form-group">
              <label for="reg-date">Date</label>
              <input type="date" id="reg-date" class="form-control" required>
            </div>
          </div>
          <div class="form-group">
            <label for="reg-time">Time</label>
            <input type="time" id="reg-time" class="form-control" required>
          </div>

          <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Save & Continue to Scan →</button>
        </form>
      </div>
    </main>
  </div>

  <script src="js/auth.js"></script>
  <script src="js/patient.js"></script>
</body>
</html>
