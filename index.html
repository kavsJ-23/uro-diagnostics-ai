<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Uro Diagnostics AI</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh;">

  <div class="glass-card" style="width: 100%; max-width: 400px;">
    <div class="brand" style="justify-content: center; margin-bottom: 1.5rem;">
      <div class="brand-icon">🔬</div>
      <span>Uro AI</span>
    </div>

    <h2 style="text-align: center; margin-bottom: 0.5rem;">Clinician Login</h2>
    <p style="text-align: center; color: var(--text-muted); margin-bottom: 1.5rem; font-size: 0.875rem;">Enter credentials to access diagnostic console</p>

    <form id="login-form">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" class="form-control" value="doctor" required>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" class="form-control" value="123456" required>
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Authenticate</button>
    </form>
  </div>

  <script src="js/auth.js"></script>
  <script>
    document.getElementById('login-form').addEventListener('submit', (e) => {
      e.preventDefault();
      loginUser(
        document.getElementById('username').value.trim(),
        document.getElementById('password').value.trim()
      );
    });
  </script>
</body>
</html>
